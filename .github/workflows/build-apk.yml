name: Build APK

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Failed to read versionName/versionCode from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=HIKaraoke_v$VERSION_NAME.apk" >> "$GITHUB_OUTPUT"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/${{ steps.app_version.outputs.apk_name }}

      - name: Create or update release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release view "${{ steps.app_version.outputs.tag_name }}" >/dev/null 2>&1 \
            && gh release delete "${{ steps.app_version.outputs.tag_name }}" --yes --cleanup-tag
          git tag "${{ steps.app_version.outputs.tag_name }}" "${GITHUB_SHA}"
          git push origin "${{ steps.app_version.outputs.tag_name }}"
          gh release create "${{ steps.app_version.outputs.tag_name }}" \
            "app/build/outputs/apk/debug/${{ steps.app_version.outputs.apk_name }}" \
            --title "HIKaraoke v${{ steps.app_version.outputs.version_name }}" \
            --notes "Automated release for version ${{ steps.app_version.outputs.version_name }} (versionCode ${{ steps.app_version.outputs.version_code }})."
