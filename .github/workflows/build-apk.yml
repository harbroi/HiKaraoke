name: Build APK

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Failed to read versionName/versionCode from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=HIKaraoke_v$VERSION_NAME.apk" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        if: ${{ secrets.HIKARAOKE_RELEASE_KEYSTORE_BASE64 != '' && secrets.HIKARAOKE_RELEASE_STORE_PASSWORD != '' && secrets.HIKARAOKE_RELEASE_KEY_ALIAS != '' && secrets.HIKARAOKE_RELEASE_KEY_PASSWORD != '' }}
        shell: bash
        env:
          HIKARAOKE_RELEASE_KEYSTORE_BASE64: ${{ secrets.HIKARAOKE_RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$HIKARAOKE_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hikaraoke-release.jks"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release APK (unsigned)
        if: ${{ !(secrets.HIKARAOKE_RELEASE_KEYSTORE_BASE64 != '' && secrets.HIKARAOKE_RELEASE_STORE_PASSWORD != '' && secrets.HIKARAOKE_RELEASE_KEY_ALIAS != '' && secrets.HIKARAOKE_RELEASE_KEY_PASSWORD != '') }}
        run: ./gradlew assembleRelease

      - name: Build release APK (signed)
        if: ${{ secrets.HIKARAOKE_RELEASE_KEYSTORE_BASE64 != '' && secrets.HIKARAOKE_RELEASE_STORE_PASSWORD != '' && secrets.HIKARAOKE_RELEASE_KEY_ALIAS != '' && secrets.HIKARAOKE_RELEASE_KEY_PASSWORD != '' }}
        env:
          ORG_GRADLE_PROJECT_HIKARAOKE_RELEASE_STORE_FILE: ${{ runner.temp }}/hikaraoke-release.jks
          ORG_GRADLE_PROJECT_HIKARAOKE_RELEASE_STORE_PASSWORD: ${{ secrets.HIKARAOKE_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_HIKARAOKE_RELEASE_KEY_ALIAS: ${{ secrets.HIKARAOKE_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_HIKARAOKE_RELEASE_KEY_PASSWORD: ${{ secrets.HIKARAOKE_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/${{ steps.app_version.outputs.apk_name }}

      - name: Create or update release
        if: github.event.pull_request.merged == true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release view "${{ steps.app_version.outputs.tag_name }}" >/dev/null 2>&1 \
            && gh release delete "${{ steps.app_version.outputs.tag_name }}" --yes --cleanup-tag
          git tag "${{ steps.app_version.outputs.tag_name }}" "${GITHUB_SHA}"
          git push origin "${{ steps.app_version.outputs.tag_name }}"
          gh release create "${{ steps.app_version.outputs.tag_name }}" \
            "app/build/outputs/apk/release/${{ steps.app_version.outputs.apk_name }}" \
            --title "HIKaraoke v${{ steps.app_version.outputs.version_name }}" \
            --notes "Automated release for version ${{ steps.app_version.outputs.version_name }} (versionCode ${{ steps.app_version.outputs.version_code }})."
